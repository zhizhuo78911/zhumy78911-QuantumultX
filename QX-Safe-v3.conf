# ============================================================
# Quantumult X 配置 · 墨鱼结构安全版 v3
# 以 墨鱼自用2026.11.24.conf 为蓝本重写
#
# 【保留】
#   - 全部策略组（6 个测速组 + 9 个用途组）
#   - 资源解析器（resource_parser_url）
#   - 红果短剧去广告规则
#   - 国内直连 / 兜底分流结构
#
# 【移除的安全隐患】
#   1. 删掉内置 p12 与 passphrase —— 证书自己在 QX 生成，私钥只在你手机上
#   2. 删掉 skip_validating_cert —— 恢复上游证书校验
#   3. 删掉 [task_local] 定时脚本 —— 不再周期性执行远程 JS
#   4. 删掉 [http_backend] BoxJS
#   5. [rewrite_remote] 清空 —— 原配置 40 多个远程重写里混着 .js，无法逐个担保
#   6. 不再引用个人域名（ddgksf2013.top / yfamilys.com）的资源
#
# 【仍需你自己决定的两处】
#   A. [server_remote] 填你的订阅
#   B. resource_parser_url 指向 KOP-XIAO 的 JS，这是 QX 官方便利功能，保留但你需自担
# ============================================================


[general]
server_check_url=http://www.gstatic.com/generate_204
server_check_timeout=3000
profile_img_url=https://github.githubassets.com/images/modules/site/integrators/google.png
geo_location_checker=disabled
# 资源解析器：用于把 GitHub 链接转成可直连的地址，保留
# 用 jsDelivr 镜像，国内可达；raw.githubusercontent.com 经常超时会表现为「解析器不更新」
resource_parser_url=https://cdn.jsdelivr.net/gh/KOP-XIAO/QuantumultX@master/Scripts/resource-parser.js
excluded_routes=239.255.255.250/32, 24.105.30.129/32, 185.60.112.157/32, 185.60.112.158/32
dns_exclusion_list=*.10099.com.cn, *.cmpassport.com, *.jegotrip.com.cn, *.icitymobile.mobi, id6.me, *.pingan.com.cn
udp_drop_list=443, STUN, QUIC
# 不设置 skip_validating_cert —— 保持证书校验


[dns]
no-ipv6
no-system
server=223.5.5.5
server=119.29.29.29
server=114.114.114.114
server=/*.icloud.com/119.29.29.29
server=/*.icloud.com.cn/119.29.29.29
server=/*.tencent.com/119.29.29.29
server=/*.weixin.com/119.29.29.29


[policy]
# ==================== 测速组 ====================
url-latency-benchmark=自动选择, server-tag-regex=^(?!.*(?:网易|墨鱼)).*$, check-interval=1200, tolerance=0
url-latency-benchmark=香港节点, server-tag-regex=(?i)(香港|HK|HongKong|Hong Kong), check-interval=1200, tolerance=0
url-latency-benchmark=台湾节点, server-tag-regex=(?i)(台湾|台灣|TW|Taiwan), check-interval=1200, tolerance=0
url-latency-benchmark=日本节点, server-tag-regex=(?i)(日本|JP|Japan), check-interval=1200, tolerance=0
url-latency-benchmark=狮城节点, server-tag-regex=(?i)(新加坡|狮城|SG|Singapore), check-interval=1200, tolerance=0
url-latency-benchmark=美国节点, server-tag-regex=(?i)(美国|US|United States|America), check-interval=1200, tolerance=0

# ==================== 用途组 ====================
# 成员只写策略组名和 direct，不写 proxy（避免和内置关键字冲突）
static=Telegram, 自动选择, 香港节点, 台湾节点, 日本节点, 美国节点
static=推特X, 自动选择, 香港节点, 台湾节点, 日本节点, 美国节点
static=tiktok, 自动选择, 日本节点, 台湾节点, 美国节点, 香港节点
static=国际媒体, 台湾节点, 自动选择, direct, 香港节点, 日本节点, 美国节点, 狮城节点
static=声田音乐, 美国节点, 自动选择, direct, 台湾节点, 香港节点, 日本节点, 狮城节点
static=哔哩哔哩, direct, 香港节点, 台湾节点
static=苹果服务, direct, 香港节点, 台湾节点, 美国节点, 日本节点, 狮城节点
static=全球加速, 自动选择, direct, 香港节点, 台湾节点, 日本节点, 狮城节点, 美国节点
static=兜底分流, 自动选择, 全球加速, direct, 香港节点, 台湾节点, 日本节点, 狮城节点, 美国节点


[server_local]
# 手动添加的节点会出现在这里


[server_remote]
# ===== A. 换成你自己的订阅链接 =====
# https://你的订阅地址, tag=我的节点, update-interval=86400, opt-parser=true, enabled=true
# ===================================


